name: sync-resume

# Keep the in-browser resume (served at miraclx.github.io/Miraculous-Owonubi-Resume.pdf)
# in sync with the latest release of miraclx/resume. No cross-repo credentials: this repo
# pulls the public release with its own token. Runs daily, and on demand via "Run workflow".
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest resume PDF
        run: curl -fsSL -o Miraculous-Owonubi-Resume.pdf "https://github.com/miraclx/resume/releases/latest/download/Miraculous-Owonubi-Resume.pdf"

      - name: Commit if changed
        run: |
          if git diff --quiet -- Miraculous-Owonubi-Resume.pdf; then
            echo "resume PDF already current, nothing to sync"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Miraculous-Owonubi-Resume.pdf
            git commit -m "sync resume PDF from latest release"
            git push
          fi
